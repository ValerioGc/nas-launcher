sonar.projectKey=nas-launcher
sonar.projectName=Nas Launcher
sonar.projectVersion=0.1.38

sonar.sources=src,backend/axum/src
sonar.tests=src/tests,backend/tests
sonar.exclusions=src/tests/**,**/node_modules/**,**/dist/**,**/coverage/**,**/.features-gen/**,src/i18n/**/it.ts,src/i18n/**/en.ts,src/types/api.ts

sonar.sourceEncoding=UTF-8

# Frontend coverage report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,**/*.spec.ts,**/*.d.ts

# Backend coverage report.
sonar.rust.lcov.reportPaths=backend/coverage/lcov.info
sonar.rust.clippy.reportPaths=backend/clippy-report.json
