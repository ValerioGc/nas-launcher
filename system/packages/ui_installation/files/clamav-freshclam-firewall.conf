# Installed by nas-os beside the clamav-freshclam package of Debian: the signatures come down as
# the user clamav, and the base firewall lets the web out only to the cgroups of its set
# nas_apps_out, where this puts the updater.
[Unit]
After=nas-os-base-firewall.service

[Service]
NFTSet=cgroup:inet:nas_base:nas_apps_out
