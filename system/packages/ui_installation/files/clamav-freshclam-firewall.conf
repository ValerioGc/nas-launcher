# Adds the FreshClam service cgroup to the nas_apps_out firewall set.
# This permits signature downloads by the clamav user through the base firewall.
# The launcher installer adds this drop-in to Debian's clamav-freshclam service.
[Unit]
After=nas-os-base-firewall.service

[Service]
NFTSet=cgroup:inet:nas_base:nas_apps_out
